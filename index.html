<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f6">
  <title>Luyện đề tổng hợp · Kanji &amp; Ngữ pháp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="menu-button" id="menuButton" type="button" aria-label="Mở thanh bên" aria-controls="sidebar" aria-expanded="false">
    <span class="menu-lines" aria-hidden="true"></span>
  </button>
  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="sidebar" id="sidebar" aria-label="Thông tin bộ đề" aria-hidden="true">
    <div class="sidebar-top">
      <span class="mark" aria-hidden="true">文</span>
      <button id="closeSidebar" type="button" aria-label="Đóng thanh bên">×</button>
    </div>
    <h2>Luyện đề<br>tổng hợp.</h2>
    <p>Kanji và ngữ pháp bài 6–10 được trộn ngẫu nhiên, không chia bài hay kiểu câu hỏi.</p>
    <div class="sidebar-facts">
      <div><span>Kanji</span><strong id="wordCount">283 từ</strong></div>
      <div><span>Ngữ pháp</span><strong id="grammarCount">68 cấu trúc</strong></div>
    </div>
    <p class="sidebar-hint">Phím 1–4 để chọn đáp án. Nhấn ← để xem câu trước, → hoặc Enter để sang câu tiếp.</p>
  </aside>

  <main class="quiz" aria-label="Đề kiểm tra tổng hợp">
    <h1 class="question-prompt" id="questionPrompt"></h1>
    <p class="question-text" id="questionText"></p>
    <div class="answers" id="answers"></div>
    <nav class="question-nav" aria-label="Chuyển câu hỏi">
      <button id="previousButton" type="button">← Câu trước</button>
      <button id="nextButton" type="button">Câu tiếp →</button>
    </nav>
    <div class="feedback" id="feedback" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="data.js"></script>
  <script src="grammar-data.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
