<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f6">
  <title>Luyện đề tổng hợp · Kanji &amp; Ngữ pháp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="menu-button" id="menuButton" type="button" aria-label="Mở thanh bên" aria-controls="sidebar" aria-expanded="false">
    <span class="menu-lines" aria-hidden="true"></span>
  </button>
  <nav class="mode-switch" aria-label="Chọn bộ đề">
    <a href="index.html" data-mode="all">Tổng hợp</a>
    <a href="index.html?mode=kanji" data-mode="kanji">Kanji</a>
    <a href="index.html?mode=grammar" data-mode="grammar">Ngữ pháp</a>
    <a href="index.html?mode=vocab" data-mode="vocab">Từ vựng</a>
    <a href="index.html?mode=exam" data-mode="exam">Đề thi</a>
  </nav>
  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="sidebar" id="sidebar" aria-label="Thông tin bộ đề" aria-hidden="true">
    <div class="sidebar-top">
      <span class="mark" aria-hidden="true">文</span>
      <button id="closeSidebar" type="button" aria-label="Đóng thanh bên">×</button>
    </div>
    <h2 id="sidebarTitle">Luyện đề<br>tổng hợp.</h2>
    <div class="sidebar-facts" id="sidebarFacts">
      <div><span>Lượt hiện tại</span><strong id="roundCount">1</strong></div>
      <div id="mixRow" class="mix-row" hidden><span>Gồm các phần</span><span class="mix-options" id="mixOptions"></span>
        <small id="mixNote" hidden>Đóng thanh bên để áp dụng.</small></div>
      <div id="kanjiMeaningRow"><label for="kanjiMeaning">Hỏi cả nghĩa Kanji<small>Thêm dạng Kanji → nghĩa và nghĩa → Kanji</small></label>
        <input type="checkbox" id="kanjiMeaning"></div>
      <div><label for="chunkSize">Số câu mỗi phần</label>
        <select id="chunkSize"><option value="6">6 câu</option><option value="10">10 câu</option><option value="20">20 câu</option></select></div>
    </div>
  </aside>

  <main class="quiz" id="quiz" aria-label="Đề kiểm tra tổng hợp">
    <div class="progress">
      <div class="progress-bar" id="progressBar" role="progressbar" aria-label="Số câu đã thuộc" aria-valuemin="0" aria-valuenow="0">
        <span class="progress-track" id="progressTrack"><span class="progress-window"><span class="progress-strip" id="progressStrip"></span></span><span class="progress-count done" id="progressDone">0</span></span>
        <span class="progress-count total" id="progressTotal">0</span>
      </div>
      <p class="progress-note" id="progressNote"></p>
    </div>
    <h1 class="question-prompt" id="questionPrompt"></h1>
    <section class="passage" id="passage" aria-label="Bài đọc" hidden>
      <h2 id="passageTitle" lang="ja"></h2>
      <p id="passageText" lang="ja"></p>
    </section>
    <p class="question-text" id="questionText"></p>
    <div class="study-hints" aria-label="Gợi ý học tập">
      <div class="hint-control">
        <button id="hiraButton" type="button" aria-controls="hiraHint" aria-expanded="false">Hiện hira</button>
        <span id="hiraHint" class="hint-value jp" lang="ja" hidden></span>
      </div>
      <div class="hint-control">
        <button id="meaningButton" type="button" aria-controls="meaningHint" aria-expanded="false">Hiện dịch</button>
        <span id="meaningHint" class="hint-value" hidden></span>
      </div>
    </div>
    <div class="answers" id="answers"></div>
    <nav class="question-nav" aria-label="Chuyển câu hỏi">
      <button id="previousButton" type="button">← Câu trước</button>
      <button id="nextButton" type="button">Câu tiếp →</button>
    </nav>
    <div class="feedback" id="feedback" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="data.js"></script>
  <script src="grammar-data.js"></script>
  <script src="grammar-examples.js"></script>
  <script src="vocab-data.js"></script>
  <script src="exam-data.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
